<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #06060b;
            --bg-card: #0f1017;
            --bg-card-hover: #151620;
            --bg-option: rgba(255,255,255,0.025);
            --bg-option-hover: rgba(255,255,255,0.055);
            --border-subtle: rgba(255,255,255,0.06);
            --border-option: rgba(255,255,255,0.08);
            --border-option-hover: rgba(255,255,255,0.18);
            --text-primary: #e8ecf4;
            --text-secondary: #7c8494;
            --text-dim: #4a4f5e;
            --accent-green: #22c55e;
            --accent-green-bg: rgba(34,197,94,0.10);
            --accent-green-border: rgba(34,197,94,0.45);
            --accent-orange: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-blue-soft: rgba(59,130,246,0.12);
            --radius-card: 16px;
            --radius-option: 12px;
            --radius-badge: 8px;
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* ── Header ─────────────────────────────── */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6,6,11,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 20px 12px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #e8ecf4 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.02em;
        }

        .badge-waiting {
            background: var(--accent-blue-soft);
            color: var(--accent-blue);
            animation: badge-pulse 2s ease-in-out infinite;
        }

        .badge-active {
            background: var(--accent-green-bg);
            color: var(--accent-green);
        }

        .badge-done {
            background: var(--accent-green-bg);
            color: var(--accent-green);
        }

        @keyframes badge-pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Progress bar */
        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), #4ade80);
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .progress-text {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* ── Main content ───────────────────────── */

        .main {
            padding: 16px 16px 100px;
            max-width: 640px;
            margin: 0 auto;
        }

        /* ── Waiting state ──────────────────────── */

        .waiting {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 65dvh;
            gap: 20px;
        }

        .pulse-container {
            position: relative;
            width: 56px;
            height: 56px;
        }

        .pulse-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--accent-blue-soft);
            animation: ring-pulse 2.5s ease-in-out infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        .pulse-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59,130,246,0.3);
        }

        @keyframes ring-pulse {
            0% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        .waiting-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .waiting-sub {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* ── Question cards ─────────────────────── */

        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 14px;
            transition: border-color 0.3s ease, opacity 0.3s ease;
            animation: card-in 0.35s ease-out both;
        }

        .question-card.answered {
            border-color: var(--accent-green-border);
            opacity: 0.65;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .question-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: var(--radius-badge);
            background: rgba(255,255,255,0.05);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .question-card.answered .question-number {
            background: var(--accent-green-bg);
            color: var(--accent-green);
        }

        .question-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-dim);
        }

        .question-text {
            font-size: 14px;
            line-height: 1.65;
            color: var(--text-primary);
            margin-bottom: 16px;
            word-break: break-word;
        }

        .question-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 16px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
        }

        /* ── Option buttons ─────────────────────── */

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
            padding: 13px 14px;
            background: var(--bg-option);
            border: 1.5px solid var(--border-option);
            border-radius: var(--radius-option);
            color: var(--text-primary);
            font-size: 13.5px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.18s ease;
            text-align: left;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--bg-option-hover);
            border-color: var(--border-option-hover);
            transform: translateY(-1px);
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.985);
            transition-duration: 0.06s;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.selected {
            background: var(--accent-green-bg);
            border-color: var(--accent-green);
        }

        .option-btn.dimmed {
            opacity: 0.28;
            pointer-events: none;
        }

        .option-letra {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            min-width: 28px;
            border-radius: var(--radius-badge);
            background: rgba(255,255,255,0.06);
            font-weight: 600;
            font-size: 12px;
            transition: all 0.18s ease;
        }

        .option-btn.selected .option-letra {
            background: var(--accent-green);
            color: var(--bg-primary);
        }

        .option-text {
            flex: 1;
            padding-top: 3px;
        }

        .option-text img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-top: 6px;
        }

        /* ── All done banner ────────────────────── */

        .done-banner {
            text-align: center;
            padding: 40px 20px;
            animation: card-in 0.4s ease-out;
        }

        .done-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .done-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-green);
        }

        .done-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* ── KaTeX tweaks ───────────────────────── */

        .katex { font-size: 1em !important; }
        .katex-display { margin: 8px 0 !important; overflow-x: auto; overflow-y: hidden; }

        /* ── Scrollbar ──────────────────────────── */

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

        /* ── Error state ────────────────────────── */

        .error-msg {
            text-align: center;
            color: #ef4444;
            font-size: 13px;
            padding: 40px 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <span class="header-title">Quiz Helper</span>
            <span class="header-badge badge-waiting" id="statusBadge">Esperando...</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText"></div>
    </div>

    <div class="main" id="content">
        <div class="waiting" id="waitingState">
            <div class="pulse-container">
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
                <div class="pulse-dot"></div>
            </div>
            <div class="waiting-text">Esperando quiz...</div>
            <div class="waiting-sub">La página se actualiza automáticamente</div>
        </div>
    </div>

    <script>
        const BASE = window.location.origin;
        let currentCreatedAt = null;
        let session = null;
        let pollTimer = null;

        // ── Audio ping ────────────────────────────
        function playPing() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.value = 880;
                gain.gain.value = 0.08;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                osc.stop(ctx.currentTime + 0.25);
            } catch(e) {}
        }

        // ── KaTeX rendering ───────────────────────
        function renderMath(el) {
            if (!window.renderMathInElement) return;
            try {
                renderMathInElement(el, {
                    delimiters: [
                        { left: "$$", right: "$$", display: true },
                        { left: "$", right: "$", display: false },
                        { left: "\\(", right: "\\)", display: false },
                        { left: "\\[", right: "\\]", display: true }
                    ],
                    throwOnError: false,
                    strict: false
                });
            } catch(e) {}
        }

        // ── Polling ───────────────────────────────
        async function pollStatus() {
            try {
                const res = await fetch(BASE + "/api/status");
                const data = await res.json();

                if (!data.active) {
                    showWaiting();
                    return;
                }

                // New session detected
                if (data.createdAt !== currentCreatedAt) {
                    currentCreatedAt = data.createdAt;
                    await loadFullSession();
                    playPing();
                    return;
                }

                // Update progress
                updateProgress(data.answered, data.total);

            } catch(e) {
                console.warn("[Helper] Poll error:", e.message);
            }
        }

        async function loadFullSession() {
            try {
                const res = await fetch(BASE + "/api/session");
                if (!res.ok) { showWaiting(); return; }
                session = await res.json();
                renderQuestions(session);
            } catch(e) {
                document.getElementById("content").innerHTML =
                    '<div class="error-msg">Error cargando sesión: ' + e.message + '</div>';
            }
        }

        // ── UI ────────────────────────────────────
        function showWaiting() {
            const badge = document.getElementById("statusBadge");
            badge.textContent = "Esperando...";
            badge.className = "header-badge badge-waiting";
            document.getElementById("progressFill").style.width = "0%";
            document.getElementById("progressText").textContent = "";

            if (!document.getElementById("waitingState")) {
                document.getElementById("content").innerHTML = `
                    <div class="waiting" id="waitingState">
                        <div class="pulse-container">
                            <div class="pulse-ring"></div>
                            <div class="pulse-ring"></div>
                            <div class="pulse-dot"></div>
                        </div>
                        <div class="waiting-text">Esperando quiz...</div>
                        <div class="waiting-sub">La página se actualiza automáticamente</div>
                    </div>`;
            }
        }

        function updateProgress(answered, total) {
            if (!total) return;
            const pct = Math.round((answered / total) * 100);
            document.getElementById("progressFill").style.width = pct + "%";
            document.getElementById("progressText").textContent = answered + " / " + total + " respondidas";

            const badge = document.getElementById("statusBadge");
            if (answered >= total) {
                badge.textContent = "✓ Completado";
                badge.className = "header-badge badge-done";
            } else {
                badge.textContent = answered + "/" + total;
                badge.className = "header-badge badge-active";
            }
        }

        function renderQuestions(sess) {
            const container = document.getElementById("content");
            container.innerHTML = "";

            const answered = sess.questions.filter(q => q.respuesta).length;
            updateProgress(answered, sess.questions.length);

            sess.questions.forEach((q, idx) => {
                const card = document.createElement("div");
                card.className = "question-card" + (q.respuesta ? " answered" : "");
                card.id = "q-" + idx;
                card.style.animationDelay = (idx * 0.06) + "s";

                // Header
                const header = document.createElement("div");
                header.className = "question-header";
                const numBadge = document.createElement("div");
                numBadge.className = "question-number";
                numBadge.textContent = idx + 1;
                const label = document.createElement("span");
                label.className = "question-label";
                label.textContent = "Pregunta " + (idx + 1);
                header.appendChild(numBadge);
                header.appendChild(label);
                card.appendChild(header);

                // Enunciado
                if (q.enunciado) {
                    const text = document.createElement("div");
                    text.className = "question-text";
                    text.textContent = q.enunciado;
                    card.appendChild(text);
                }

                // Image
                if (q.imagenBase64) {
                    const img = document.createElement("img");
                    img.className = "question-image";
                    img.src = "data:" + (q.imagenMimeType || "image/png") + ";base64," + q.imagenBase64;
                    img.alt = "Imagen pregunta " + (idx + 1);
                    card.appendChild(img);
                }

                // Options
                const optsList = document.createElement("div");
                optsList.className = "options-list";

                q.opciones.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    if (q.respuesta === opt.letra) btn.classList.add("selected");
                    if (q.respuesta && q.respuesta !== opt.letra) btn.classList.add("dimmed");
                    if (q.respuesta) btn.disabled = true;

                    const letraBadge = document.createElement("span");
                    letraBadge.className = "option-letra";
                    letraBadge.textContent = opt.letra;

                    const textSpan = document.createElement("span");
                    textSpan.className = "option-text";
                    // Use htmlRaw if available for richer formatting, fallback to texto
                    if (opt.htmlRaw && opt.htmlRaw.trim()) {
                        textSpan.innerHTML = opt.htmlRaw;
                    } else {
                        textSpan.textContent = opt.texto;
                    }

                    btn.appendChild(letraBadge);
                    btn.appendChild(textSpan);

                    if (!q.respuesta) {
                        btn.addEventListener("click", () => submitAnswer(idx, opt.letra, card));
                    }

                    optsList.appendChild(btn);
                });

                card.appendChild(optsList);
                container.appendChild(card);
            });

            // Check if all done
            if (answered >= sess.questions.length) {
                showDoneBanner(container);
            }

            // Render KaTeX on the whole page
            setTimeout(() => renderMath(container), 100);
            setTimeout(() => renderMath(container), 600);
        }

        function showDoneBanner(container) {
            const banner = document.createElement("div");
            banner.className = "done-banner";
            banner.innerHTML = `
                <div class="done-icon">✅</div>
                <div class="done-text">Todas respondidas</div>
                <div class="done-sub">Las respuestas se marcaron automáticamente en el quiz</div>
            `;
            container.appendChild(banner);
        }

        async function submitAnswer(questionIndex, letra, card) {
            // Immediately update UI
            const buttons = card.querySelectorAll(".option-btn");
            buttons.forEach(btn => {
                btn.disabled = true;
                const letraEl = btn.querySelector(".option-letra");
                if (letraEl && letraEl.textContent === letra) {
                    btn.classList.add("selected");
                } else {
                    btn.classList.add("dimmed");
                }
            });
            card.classList.add("answered");
            card.querySelector(".question-number").style.background = "var(--accent-green-bg)";
            card.querySelector(".question-number").style.color = "var(--accent-green)";

            // Update local session
            if (session) {
                session.questions[questionIndex].respuesta = letra;
                const answered = session.questions.filter(q => q.respuesta).length;
                updateProgress(answered, session.questions.length);

                if (answered >= session.questions.length) {
                    showDoneBanner(document.getElementById("content"));
                }
            }

            // Send to server
            try {
                await fetch(BASE + "/api/answer", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ questionIndex, letra })
                });
            } catch(e) {
                console.error("[Helper] Error enviando respuesta:", e);
                // Re-enable buttons on error
                buttons.forEach(btn => {
                    btn.disabled = false;
                    btn.classList.remove("selected", "dimmed");
                });
                card.classList.remove("answered");
            }

            // Auto-scroll to next unanswered
            if (session) {
                const nextIdx = session.questions.findIndex((q, i) => i > questionIndex && !q.respuesta);
                if (nextIdx !== -1) {
                    setTimeout(() => {
                        const nextCard = document.getElementById("q-" + nextIdx);
                        if (nextCard) {
                            nextCard.scrollIntoView({ behavior: "smooth", block: "start" });
                        }
                    }, 250);
                }
            }
        }

        // ── Init ──────────────────────────────────
        // Poll every 3 seconds
        pollStatus();
        pollTimer = setInterval(pollStatus, 3000);
    </script>
</body>
</html>
